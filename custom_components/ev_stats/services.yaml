move_energy:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ev_stats
    source_bucket:
      required: true
      example: unknown
      selector:
        text:
    target_bucket:
      required: true
      example: home
      selector:
        text:
    kwh:
      required: true
      example: 10.5
      selector:
        number:
          min: 0
          max: 500
          step: 0.001
          mode: box
          unit_of_measurement: kWh
